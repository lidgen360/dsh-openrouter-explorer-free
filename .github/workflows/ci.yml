name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (no runtime dependencies)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        shell: bash
        run: |
          node --check index.js
          node --check lib/client.js
          for file in src/host/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/
      - name: Secret guard
        shell: bash
        run: |
          if grep -rInE '(sk-or-v1-[A-Za-z0-9]{16,}|OPENROUTER_API_KEY=[^"[:space:]]+)' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github \
              --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' . ; then
            echo '::error::possible API key committed'
            exit 1
          fi
