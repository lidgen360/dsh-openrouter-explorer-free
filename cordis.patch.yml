# Bundle layer for dsh-openrouter-explorer-free.
# One row mounts both halves: index.js (host) and lib/client.js (right-sidebar tab).
- insert:
    - id: openrouter-explorer-free
      name: dsh-openrouter-explorer-free
      config:
        provider: openrouter
        intervalHours: 24
        discountPct: 30
        apiKeyRef: OPENROUTER_API_KEY
        autoProvision: true
        tool: false
